<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Skin gradient: blue-grey rocky/pale skin -->
    <linearGradient id="skinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8BB0BF"/> <!-- Lighter blue-grey -->
      <stop offset="50%" stop-color="#7A92A2"/> <!-- Mid blue-grey -->
      <stop offset="100%" stop-color="#6A808C"/> <!-- Darker blue-grey -->
    </linearGradient>
    <!-- Darker skin gradient for shadowed parts -->
    <linearGradient id="skinGradDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6A808C"/>
      <stop offset="50%" stop-color="#5A707C"/>
      <stop offset="100%" stop-color="#4A606C"/>
    </linearGradient>
    <!-- Shorts gradient: tattered brown cloth -->
    <linearGradient id="shortsGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A87B4C"/> <!-- Lighter brown -->
      <stop offset="50%" stop-color="#9B6A3B"/> <!-- Mid brown -->
      <stop offset="100%" stop-color="#8B5A2B"/> <!-- Darker brown -->
    </linearGradient>
  </defs>

  <!-- Back Leg (Right leg - slightly trailing) -->
  <path d="M60 96 C56 88 54 78 56 68 C58 58 62 52 68 54 L72 64 C74 76 72 88 68 96 Z"
        fill="url(#skinGradDark)" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Back Foot -->
  <path d="M68 96 L70 90 L68 84 L60 84 Q55 88 60 96 Z"
        fill="url(#skinGradDark)" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Back Arm (Left arm - slightly back, fist clenched) -->
  <path d="M22 42 Q18 30 20 18 L26 10 Q30 8 36 12 L38 20 Q40 30 32 40 L22 42 Z"
        fill="url(#skinGradDark)" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Back Fist -->
  <path d="M22 42 Q18 38 18 30 L20 24 Q24 20 28 24 L28 32 Q26 38 22 42 Z"
        fill="url(#skinGradDark)" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Torso (Wide and stocky build) -->
  <path d="M72 40 C78 30 80 18 76 8 C72 0 60 -2 50 0 C40 -2 28 0 24 8 C20 18 22 30 28 40 L28 52 C28 60 32 68 40 70 L56 70 C64 68 68 60 68 52 Z"
        fill="url(#skinGrad)" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Torso shading/muscle lines for depth -->
  <path d="M40 8 Q45 12 50 8 Q55 12 60 8" fill="none" stroke="#000" stroke-width="1.5" opacity="0.5"/>
  <path d="M35 30 Q45 35 60 30" fill="none" stroke="#000" stroke-width="1.5" opacity="0.5"/>
  <path d="M30 45 Q40 50 65 45" fill="none" stroke="#000" stroke-width="1.5" opacity="0.5"/>

  <!-- Shorts (Tattered brown cloth) -->
  <path d="M40 70 L56 70 C64 68 68 60 68 52 L28 52 C28 60 32 68 40 70 Z"
        fill="url(#shortsGrad)" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Shorts tattered bottom edge detail -->
  <path d="M32 68 Q36 72 40 70 Q44 68 48 70 Q52 72 56 70 Q60 68 64 70"
        fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Shorts side tears detail -->
  <path d="M28 52 Q30 58 32 52 Q34 48 36 52" fill="url(#shortsGrad)" stroke="#000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M68 52 Q66 58 64 52 Q62 48 60 52" fill="url(#shortsGrad)" stroke="#000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Front Leg (Left leg - stomping forward) -->
  <path d="M36 96 C40 88 42 78 40 68 C38 58 34 52 28 54 L24 64 C22 76 24 88 28 96 Z"
        fill="url(#skinGrad)" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Front Foot -->
  <path d="M28 96 L26 90 L28 84 L36 84 Q41 88 36 96 Z"
        fill="url(#skinGrad)" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Front Arm (Right arm - slightly forward, fist clenched) -->
  <path d="M74 42 Q78 30 76 18 L70 10 Q66 8 60 12 L58 20 Q56 30 64 40 L74 42 Z"
        fill="url(#skinGrad)" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Front Fist (Huge fists) -->
  <path d="M74 42 Q78 38 78 30 L76 24 Q72 20 68 24 L68 32 Q70 38 74 42 Z"
        fill="url(#skinGrad)" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Head (Bald, simple but powerful expression) -->
  <path d="M68 8 C72 18 70 28 60 30 L36 30 C26 28 24 18 28 8 C32 0 40 -2 48 0 C56 -2 64 0 68 8 Z"
        fill="url(#skinGrad)" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Brow ridge for expression -->
  <path d="M58 18 C56 20 50 22 46 22 C42 22 36 20 34 18" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="42" cy="20" r="2" fill="#FFF" stroke="#000" stroke-width="1"/>
  <circle cx="54" cy="20" r="2" fill="#FFF" stroke="#000" stroke-width="1"/>
  <circle cx="42" cy="20" r="0.8" fill="#000"/>
  <circle cx="54" cy="20" r="0.8" fill="#000"/>
  <!-- Mouth (Determined expression) -->
  <path d="M40 24 Q48 26 56 24" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
</svg>