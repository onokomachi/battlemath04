<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Gradients for depth and shine -->
        <linearGradient id="stoneGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#A9A9A9"/>
            <stop offset="100%" stop-color="#757575"/>
        </linearGradient>
        <linearGradient id="vatGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#BA55D3"/>
            <stop offset="50%" stop-color="#9932CC"/>
            <stop offset="100%" stop-color="#8A2BE2"/>
        </linearGradient>
        <linearGradient id="liquidGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#8A2BE2"/>
            <stop offset="100%" stop-color="#6A0DAD"/>
        </linearGradient>
        <linearGradient id="pipeGradient" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#DAA520"/>
            <stop offset="50%" stop-color="#B87333"/>
            <stop offset="100%" stop-color="#CD7F32"/>
        </linearGradient>
        <linearGradient id="chimneyGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#959595"/>
            <stop offset="100%" stop-color="#707070"/>
        </linearGradient>

        <!-- Filter for blur effect for the glow -->
        <filter id="blurFilter">
            <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
        </filter>
    </defs>

    <!-- 1. Glowing purple aura (farthest back, blurred shapes) -->
    <path d="M28 75 C20 60, 20 40, 28 25 L100 25 C108 40, 108 60, 100 75 Z" fill="#BA55D3" fill-opacity="0.5" filter="url(#blurFilter)"/>
    <ellipse cx="64" cy="100" rx="40" ry="10" fill="#9932CC" fill-opacity="0.4" filter="url(#blurFilter)"/>

    <!-- 2. Stone Foundation -->
    <g stroke="#000" stroke-width="2" stroke-linejoin="round">
        <!-- Main block -->
        <path d="M20 118 H108 V95 H20 Z" fill="url(#stoneGradient)"/>
        <!-- Top surface of main block -->
        <path d="M20 95 H108 V90 H20 Z" fill="#C0C0C0"/>
        <!-- Ledge on top -->
        <path d="M18 90 H110 V85 H18 Z" fill="#D0D0D0"/>
        <!-- Bottom shadow -->
        <path d="M20 118 H108 V120 H20 Z" fill="#555555" stroke="none"/>
        <!-- Some stone texture/details -->
        <path d="M25 105 L35 107 L33 112 L23 110 Z" fill="#656565" stroke="#000" stroke-width="1"/>
        <path d="M80 100 L90 98 L92 103 L82 105 Z" fill="#656565" stroke="#000" stroke-width="1"/>
    </g>

    <!-- 3. Main Vat Body (glass/crystal) -->
    <path d="M34 75 C28 60, 28 40, 34 25 L94 25 C100 40, 100 60, 94 75 Z" fill="url(#vatGradient)" fill-opacity="0.9" stroke="#000" stroke-width="2"/>
    <!-- Vat Top Rim -->
    <ellipse cx="64" cy="25" rx="30" ry="8" fill="#BA55D3" stroke="#000" stroke-width="2"/>
    <!-- Vat Base Ring -->
    <ellipse cx="64" cy="75" rx="30" ry="8" fill="#BA55D3" stroke="#000" stroke-width="2"/>

    <!-- 4. Liquid inside vat -->
    <path d="M36 70 C30 55, 30 45, 36 30 L92 30 C98 45, 98 55, 92 70 Z" fill="url(#liquidGradient)" stroke="#000" stroke-width="1" stroke-opacity="0.5"/>
    <ellipse cx="64" cy="30" rx="28" ry="7" fill="#8A2BE2" stroke="#000" stroke-width="1"/>
    <!-- Liquid surface highlight -->
    <ellipse cx="64" cy="29" rx="20" ry="4" fill="white" fill-opacity="0.4"/>
    <!-- Bubbles -->
    <circle cx="50" cy="50" r="2" fill="white" fill-opacity="0.7"/>
    <circle cx="70" cy="40" r="1.5" fill="white" fill-opacity="0.7"/>
    <circle cx="60" cy="60" r="2.5" fill="white" fill-opacity="0.7"/>
    <circle cx="45" cy="35" r="1" fill="white" fill-opacity="0.7"/>
    <circle cx="75" cy="55" r="1.8" fill="white" fill-opacity="0.7"/>

    <!-- 5. Pipes and Valves (Copper/Brass) -->
    <g stroke="#000" stroke-width="1.5">
        <!-- Main pipe leading from vat -->
        <path d="M38 50 C35 50, 35 60, 38 65 L28 65 C25 60, 25 50, 28 50 Z" fill="url(#pipeGradient)"/>
        <!-- Vertical pipe section -->
        <rect x="26" y="65" width="10" height="15" fill="url(#pipeGradient)"/>
        <!-- Pipe entering base -->
        <rect x="28" y="80" width="6" height="10" fill="url(#pipeGradient)"/>
        <!-- Valve body -->
        <circle cx="31" cy="72" r="6" fill="#CD7F32"/>
        <!-- Valve handle -->
        <path d="M31 68 V76 M27 72 H35" stroke="#DAA520" stroke-width="1.5"/>
    </g>

    <!-- 6. Chimney and Smoke -->
    <g stroke="#000" stroke-width="1.5">
        <!-- Chimney base on stone ledge -->
        <path d="M90 85 L98 85 L98 75 L90 75 Z" fill="url(#chimneyGradient)"/>
        <!-- Chimney stack -->
        <path d="M91 75 L97 75 L97 60 L91 60 Z" fill="url(#chimneyGradient)"/>
        <!-- Chimney top -->
        <path d="M90 60 L98 60 L98 55 L90 55 Z" fill="#555555"/>
    </g>
    <!-- Smoke -->
    <path d="M94 55 C98 48, 98 38, 94 33 C90 28, 85 33, 80 38 C85 43, 90 48, 94 55 Z" fill="#E0BBE4" fill-opacity="0.7" stroke="#9932CC" stroke-width="1"/>

    <!-- 7. Sparkles and Magical Particles -->
    <g fill="#FFD7F0" stroke="#BA55D3" stroke-width="0.5">
        <circle cx="30" cy="40" r="1.5"/>
        <circle cx="98" cy="50" r="1"/>
        <path d="M64 20 L66 18 L64 16 L62 18 Z"/> <!-- Simple star shape -->
        <path d="M40 25 L42 23 L40 21 L38 23 Z"/>
        <path d="M88 30 L90 28 L88 26 L86 28 Z"/>
        <circle cx="55" cy="22" r="1"/>
        <circle cx="78" cy="27" r="1.2"/>
        <circle cx="35" cy="60" r="1"/>
    </g>

    <!-- Vat highlights for glass effect -->
    <path d="M40 30 C36 45, 36 55, 40 65 L45 65 C41 55, 41 45, 45 30 Z" fill="white" fill-opacity="0.3"/>
    <path d="M88 30 C92 45, 92 55, 88 65 L83 65 C87 55, 87 45, 83 30 Z" fill="white" fill-opacity="0.2"/>
    <path d="M64 25 C60 27, 60 30, 64 32 C68 30, 68 27, 64 25 Z" fill="white" fill-opacity="0.5"/>
</svg>