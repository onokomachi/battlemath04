<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <!-- Cloak Base (back) -->
  <path d="M48 6 C20 0 0 20 0 45 L0 75 C0 90 20 96 48 96 C76 96 96 90 96 75 L96 45 C96 20 76 0 48 6 Z" fill="#2E8B57" stroke="#000" stroke-width="1.5"/>
  <!-- Cloak Front/Shoulders -->
  <path d="M48 10 L15 35 L10 60 L20 75 L48 85 L76 75 L86 60 L81 35 L48 10 Z" fill="#3CB371" stroke="#000" stroke-width="1.5"/>
  <!-- Cloak shading -->
  <path d="M48 15 L25 38 L20 58 L28 70 L48 78 L68 70 L76 58 L71 38 L48 15 Z" fill="#2E8B57" opacity="0.4"/>

  <!-- Quiver -->
  <path d="M70 40 L74 38 L76 58 L72 60 Z" fill="#8B4513" stroke="#000" stroke-width="1.5"/>
  <path d="M72 40 L70 38 L68 58 L70 60 Z" fill="#A0522D" stroke="#000" stroke-width="1.5"/>
  <!-- Arrows in quiver -->
  <rect x="70" y="42" width="2" height="10" fill="#D2B48C" stroke="#000" stroke-width="0.5"/>
  <rect x="71.5" y="43" width="2" height="10" fill="#D2B48C" stroke="#000" stroke-width="0.5"/>
  <rect x="73" y="44" width="2" height="10" fill="#D2B48C" stroke="#000" stroke-width="0.5"/>

  <!-- Body (Tunic and Lower Half) -->
  <path d="M48 35 C40 30 35 35 35 45 L35 70 C35 80 40 85 48 85 C56 85 61 80 61 70 L61 45 C61 35 56 30 48 35 Z" fill="#3CB371" stroke="#000" stroke-width="1.5"/>
  <!-- Tunic bottom flare -->
  <path d="M35 70 C33 75 33 80 38 83 L48 85 L58 83 C63 80 63 75 61 70 Z" fill="#2E8B57" stroke="#000" stroke-width="1.5"/>
  <!-- Belt -->
  <path d="M37 55 C35 56 35 58 37 59 L59 59 C61 58 61 56 59 55 Z" fill="#8B4513" stroke="#000" stroke-width="1"/>
  <!-- Belt buckle -->
  <rect x="46" y="56" width="4" height="3" fill="#FFD700" stroke="#000" stroke-width="0.5"/>

  <!-- Hair (back part, under hood) -->
  <path d="M48 20 C40 15 30 20 28 30 C26 45 30 50 40 53 C48 55 56 50 68 45 C70 35 60 20 48 20 Z" fill="#6A0DAD" stroke="#000" stroke-width="1.5"/>
  <!-- Hair highlight -->
  <path d="M35 25 Q40 20 45 25" stroke="#8A2BE2" stroke-width="1" fill="none" opacity="0.7"/>
  
  <!-- Head (Face) -->
  <circle cx="48" cy="30" r="8" fill="#FDD7B1" stroke="#000" stroke-width="1.5"/>
  <!-- Face shading (under chin) -->
  <path d="M48 36 C45 37 51 37 48 36 Z" fill="#EBC89D"/>
  
  <!-- Hood (over head) -->
  <path d="M35 22 C28 15 25 25 30 35 L35 38 L48 40 L61 38 L66 35 C71 25 68 15 61 22 Z" fill="#3CB371" stroke="#000" stroke-width="1.5"/>
  <!-- Hood inside/shadow -->
  <path d="M38 25 C32 20 30 28 34 33 L48 35 L62 33 C66 28 64 20 58 25 Z" fill="#2E8B57" stroke="#000" stroke-width="1"/>
  
  <!-- Face details -->
  <circle cx="45" cy="28" r="1.5" fill="#FFF" stroke="#000" stroke-width="0.5"/>
  <circle cx="51" cy="28" r="1.5" fill="#FFF" stroke="#000" stroke-width="0.5"/>
  <circle cx="45" cy="28" r="0.8" fill="#1E90FF"/>
  <circle cx="51" cy="28" r="0.8" fill="#1E90FF"/>
  <path d="M45 31 Q48 33 51 31" stroke="#000" stroke-width="1" fill="none"/> <!-- Mouth -->
  <path d="M44 26 Q45 25 46 26" stroke="#000" stroke-width="0.5" fill="none"/> <!-- Eyebrows -->
  <path d="M50 26 Q51 25 52 26" stroke="#000" stroke-width="0.5" fill="none"/> <!-- Eyebrows -->
  <ellipse cx="43" cy="33" rx="1.5" ry="0.8" fill="#FFC0CB" opacity="0.7"/> <!-- Blush -->
  <ellipse cx="53" cy="33" rx="1.5" ry="0.8" fill="#FFC0CB" opacity="0.7"/> <!-- Blush -->

  <!-- Hair strands (front) -->
  <path d="M38 30 Q35 35 30 35" stroke="#5A0BA0" stroke-width="1" fill="none"/>
  <path d="M58 30 Q61 35 66 35" stroke="#5A0BA0" stroke-width="1" fill="none"/>

  <!-- Left Arm (holding bow) -->
  <path d="M30 48 C20 40 10 45 10 55 L15 60 L20 55 L25 50 Z" fill="#3CB371" stroke="#000" stroke-width="1.5"/> <!-- Sleeve -->
  <path d="M25 50 C23 53 23 56 25 58 L30 58 L32 55 L30 52 Z" fill="#2E8B57" stroke="#000" stroke-width="1"/> <!-- Sleeve cuff shadow -->
  <path d="M38 45 C35 40 30 45 30 50 L31 56 C33 57 35 57 38 56 L40 48 Z" fill="#FDD7B1" stroke="#000" stroke-width="1.5"/> <!-- Hand -->
  <path d="M31 56 Q30 55 30 54" stroke="#000" stroke-width="0.5" fill="none"/> <!-- Thumb detail -->

  <!-- Right Arm (drawing arrow) -->
  <path d="M66 48 C76 40 86 45 86 55 L81 60 L76 55 L71 50 Z" fill="#3CB371" stroke="#000" stroke-width="1.5"/> <!-- Sleeve -->
  <path d="M71 50 C73 53 73 56 71 58 L66 58 L64 55 L66 52 Z" fill="#2E8B57" stroke="#000" stroke-width="1"/> <!-- Sleeve cuff shadow -->
  <path d="M58 45 C61 40 66 45 66 50 L65 56 C63 57 61 57 58 56 L56 48 Z" fill="#FDD7B1" stroke="#000" stroke-width="1.5"/> <!-- Hand -->
  <path d="M65 56 Q66 55 66 54" stroke="#000" stroke-width="0.5" fill="none"/> <!-- Thumb detail -->

  <!-- Bow -->
  <path d="M15 55 C5 65 10 75 25 80 L30 78 C18 73 13 65 20 58 Z" fill="#8B4513" stroke="#000" stroke-width="1.5"/> <!-- Left limb -->
  <path d="M20 58 C25 60 30 60 35 58 L38 55 C32 57 27 57 22 55 Z" fill="#A0522D" stroke="#000" stroke-width="1"/> <!-- Handle area -->
  <path d="M38 55 C40 50 45 50 48 55 L50 58 C45 58 40 58 38 55 Z" fill="#8B4513" stroke="#000" stroke-width="1"/> <!-- Handle grip -->
  <path d="M80 55 C90 65 85 75 70 80 L65 78 C77 73 82 65 75 58 Z" fill="#8B4513" stroke="#000" stroke-width="1.5"/> <!-- Right limb -->
  <line x1="18" y1="57" x2="60" y2="57" stroke="#000" stroke-width="1.5"/> <!-- Bowstring (drawn position) -->

  <!-- Arrow -->
  <rect x="60" y="56" width="30" height="2" fill="#D2B48C" stroke="#000" stroke-width="1"/> <!-- Shaft -->
  <polygon points="90 55 90 59 92 57" fill="#000"/> <!-- Arrowhead -->
  <polygon points="60 55 58 54 58 58 60 57" fill="#F0F0F0" stroke="#000" stroke-width="0.5"/> <!-- Fletching 1 -->
  <polygon points="60 55 58 53 58 55 60 56" fill="#F0F0F0" stroke="#000" stroke-width="0.5"/> <!-- Fletching 2 -->
  <polygon points="60 59 58 60 58 58 60 57" fill="#F0F0F0" stroke="#000" stroke-width="0.5"/> <!-- Fletching 3 -->
</svg>